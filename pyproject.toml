[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plumber"
version = "0.1.0"
description = "Typed decision model (choice / score / noul) on Nemotron 3.5 Lightning: one forward pass, calibrated probabilities over caller-supplied options."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Naveenraj Kamalakannan"}]
dependencies = ["torch>=2.6", "transformers>=5.17", "peft>=0.21", "accelerate>=1.9", "huggingface_hub>=0.30", "safetensors", "sentencepiece"]

[project.optional-dependencies]
data = ["datasets>=3.0", "pandas", "pyarrow", "tasksource"]
dev = ["pytest", "ruff", "pre-commit"]

[project.scripts]
plumber = "plumber.cli:main"

[project.urls]
Model = "https://huggingface.co/totum-labs/plumb-nemotron-3.5-lightning-30b-a3b"
Repository = "https://github.com/therealnaveenkamal/plumber"

[tool.setuptools.packages.find]
include = ["plumber*"]

[tool.setuptools.package-data]
plumber = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_local", "box_backup", "hf_release", "runs_v0", "runs_v1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "SIM115", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["plumber"]

[tool.ruff.format]
quote-style = "double"
