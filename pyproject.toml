[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbify"
version = "0.2.1"
description = "Give an open LLM a fast, calibrated decision path and serve it natively with vLLM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Naveenraj Kamalakannan"}]
dependencies = ["torch>=2.6", "transformers>=5.17", "peft>=0.21", "accelerate>=1.9", "huggingface_hub>=0.30", "safetensors", "sentencepiece"]

keywords = ["vllm", "vllm-plugin", "llm", "lora", "decision-making", "calibration", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
vllm = ["vllm==0.30.0"]
dev = ["pytest", "ruff", "pre-commit", "fastapi>=0.115", "httpx>=0.27"]

[project.scripts]
plumbify = "plumbify.cli:main"

# The vLLM plugin: loaded by every vLLM process on startup; `vllm serve <plumbed model>` needs nothing else.
[project.entry-points."vllm.general_plugins"]
plumbify = "plumbify.serving.vllm:register"

[project.urls]
Homepage = "https://github.com/therealnaveenkamal/plumbify"
Documentation = "https://github.com/therealnaveenkamal/plumbify/blob/main/docs/guide.md"
Repository = "https://github.com/therealnaveenkamal/plumbify"
Issues = "https://github.com/therealnaveenkamal/plumbify/issues"
Changelog = "https://github.com/therealnaveenkamal/plumbify/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["plumbify*"]

[tool.setuptools.package-data]
plumbify = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "SIM115", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["plumbify"]

[tool.ruff.format]
quote-style = "double"
